name: Release

# Push a tag like v0.1.0-beta.2 to build Windows and macOS installers and
# publish them as a GitHub release. The update manifest (latest.json) is then
# copied to the `updater` branch, which installed apps check for updates.
# It can also be run by hand on a branch (Actions > Release > Run workflow)
# with the tag to create; the release then creates that tag at the commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.4 (must match the version in package.json)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ env.TAG }}
          releaseName: PhDRacket ${{ env.TAG }} Beta
          releaseBody: |
            PhDRacket is a modern desktop IDE for Racket and the HtDP teaching languages. Programs run in the official Racket installation on your computer, and `.rkt` files stay exactly as DrRacket expects them.

            **What's new:** see the [release notes](https://github.com/ouyang-matters/PhDRacket/blob/main/docs/RELEASE_NOTES.md).

            ## Quick install

            **macOS** (Apple Silicon and Intel), in Terminal:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/ouyang-matters/PhDRacket/main/install/install-macos.sh | bash
            ```

            **Windows**, in PowerShell:

            ```powershell
            irm https://raw.githubusercontent.com/ouyang-matters/PhDRacket/main/install/install-windows.ps1 | iex
            ```

            The command downloads this release, checks it against the checksum published by GitHub and installs it. On macOS this avoids the *Open Anyway* step below.

            ## Manual install

            **Windows:** download `PhDRacket_<version>_x64-setup.exe` and run it. Administrator rights are not required. If Windows SmartScreen shows a warning, choose *More info*, then *Run anyway*. The installer is not code-signed yet.

            **macOS (Apple Silicon and Intel):** download `PhDRacket_<version>_universal.dmg`, open it and drag PhDRacket into Applications. The app is not notarized yet. The first time you open it, macOS blocks it; open *System Settings*, go to *Privacy & Security* and click *Open Anyway*.

            ## First launch

            This is a **beta**. Installing and using PhDRacket requires accepting the [Beta Terms of Use](https://github.com/ouyang-matters/PhDRacket/blob/main/docs/TERMS.md); the Windows installer and the first-run Setup dialog ask you to accept them.

            Setup finds your Racket installation. If Racket is not installed, click *Install Racket 9.3*: PhDRacket downloads the official installer from racket-lang.org, verifies its checksum and installs it. On Windows, the official Racket installer asks for administrator permission once.

            ## Updating

            Installed copies check for new versions at startup and install them with one click. The check can be turned off in Settings.

            Contact: support@aqouyang.com, https://www.aqouyang.com

            PhDRacket is an independent open-source project. It is not affiliated with or endorsed by the University of Waterloo or the Racket project.
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish-update-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Copy latest.json to the updater branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir manifest && cd manifest
          gh release download "$TAG" -R "$REPO" -p latest.json
          git init -q -b updater
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Update channel\n\nUsed by PhDRacket'"'"'s update check. Download PhDRacket from the Releases page.\n' > README.md
          git add latest.json README.md
          git commit -q -m "Update manifest for $TAG"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" updater
