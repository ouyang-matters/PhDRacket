[workspace]
resolver = "2"
members = ["backend", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/ouyang-matters/PhDRacket"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
