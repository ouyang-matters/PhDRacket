<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- PhDRacket mark: a mortarboard resting on a pair of parentheses. -->
  <rect width="1024" height="1024" rx="210" fill="#14213d"/>
  <!-- board -->
  <path d="M512 196 L864 352 L512 508 L160 352 Z" fill="#f1f4f8"/>
  <!-- tassel -->
  <path d="M512 352 L760 448 L760 600" fill="none" stroke="#f2b134" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="760" cy="626" r="34" fill="#f2b134"/>
  <!-- parentheses -->
  <path d="M404 470 C 330 560, 330 740, 404 830" fill="none" stroke="#f1f4f8" stroke-width="62" stroke-linecap="round"/>
  <path d="M620 470 C 694 560, 694 740, 620 830" fill="none" stroke="#f1f4f8" stroke-width="62" stroke-linecap="round"/>
</svg>
